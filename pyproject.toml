[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "sqlmodel==0.0.42",
    "python-multipart>=0.0.18,<1",
    "reportlab>=4,<5",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdfium2>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/*/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
