<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | アセスメント</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header><a href="/clients">アセスメント・利用者一覧</a></header>
  {% if request.app.state.desktop_shutdown %}
  <form method="post" action="/desktop/shutdown"
        onsubmit="return window.confirm('アプリを終了しますか？\n未保存の入力内容は保存されません。他のタブでもこのアプリを利用できなくなります。');">
    <input type="hidden" name="shutdown_token" value="{{ request.app.state.desktop_token }}">
    <button type="submit">アプリを終了する</button>
  </form>
  {% endif %}
  <main>
    <h1>{{ title }}</h1>
    {% if errors %}
    <div class="errors" role="alert"><p>入力内容を確認してください。</p><ul>
      {% for error in errors %}<li>{{ error }}</li>{% endfor %}
    </ul></div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
